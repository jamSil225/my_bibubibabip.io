<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь недели</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171614; --surface:#1C1B19; --surface-alt:#201F1D; --surface-hover:#262523;
    --border:#393836; --border-light:#4A4946;
    --text:#CDCCCA; --muted:#797876; --faint:#5A5957;
    --primary:#4F98A3;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Satoshi",system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;height:100vh;
    -webkit-font-smoothing:antialiased;user-select:none;
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);
    flex-shrink:0;z-index:10;
  }
  .topbar h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .toolbar{display:flex;align-items:center;gap:10px}
  .palette-btn{
    background:var(--surface-alt);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;
  }
  .palette-btn:hover{background:var(--surface-hover);border-color:var(--border-light)}
  .palette-btn .swatches{display:flex;gap:3px}
  .palette-btn .sw{width:14px;height:14px;border-radius:4px}
  .tool-btn{
    background:var(--surface-alt);border:1px solid var(--border);color:var(--muted);
    width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .tool-btn:hover{background:var(--surface-hover);color:var(--text)}

  .palette-pop{
    position:absolute;top:52px;right:20px;z-index:20;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;flex-direction:column;gap:14px;
    min-width:280px;
  }
  .palette-pop.open{display:flex}
  .palette-pop h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .palette-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .palette-swatch{
    width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;
    transition:transform .1s,border-color .15s;
  }
  .palette-swatch:hover{transform:scale(1.1)}
  .palette-swatch.active{border-color:#fff;transform:scale(1.1)}
  .palette-custom{display:flex;gap:8px;align-items:center}
  .palette-custom input[type=color]{
    width:36px;height:36px;border:1px solid var(--border);border-radius:8px;
    background:transparent;cursor:pointer;
  }
  .palette-custom span{font-size:13px;color:var(--muted)}
  .palette-hint{font-size:12px;color:var(--faint);line-height:1.4}

  .week{
    display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
    flex:1;overflow:hidden;background:var(--border);min-height:0;
  }
  .day-col{
    background:var(--surface);display:flex;flex-direction:column;min-height:0;
    position:relative;
  }
  .day-head{
    padding:8px 10px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;cursor:pointer;transition:filter .15s;
  }
  .day-head:hover{filter:brightness(1.15)}
  .day-head.selected{box-shadow:inset 0 0 0 2px var(--primary)}
  .day-name{font-size:14px;font-weight:700}
  .day-num{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .day-color-dot{
    width:16px;height:16px;border-radius:50%;border:2px solid var(--border-light);
    flex-shrink:0;cursor:pointer;transition:transform .1s;
  }
  .day-color-dot:hover{transform:scale(1.15)}

  .track-wrap{
    flex:1;position:relative;min-height:0;overflow:hidden;
    padding:0 6px 36px;
  }
  .track{
    position:absolute;left:6px;right:6px;top:0;bottom:36px;
    border-radius:8px;overflow:hidden;
  }
  .seg-block{
    position:absolute;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;cursor:default;transition:filter .15s;
  }
  .seg-block:hover{filter:brightness(1.1)}
  .seg-time{
    font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
    color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.4);
    pointer-events:none;white-space:nowrap;
  }
  .seg-label{
    font-size:12px;font-weight:500;color:rgba(255,255,255,.85);
    text-shadow:0 1px 3px rgba(0,0,0,.4);
    background:transparent;border:none;text-align:center;
    width:90%;max-width:160px;
    font-family:inherit;outline:none;
    pointer-events:auto;
  }
  .seg-label::placeholder{color:rgba(255,255,255,.4)}
  .seg-label:focus{color:#fff}

  .divider{
    position:absolute;left:-4px;right:-4px;height:24px;
    transform:translateY(-50%);
    cursor:ns-resize;z-index:5;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  .divider::before{
    content:'';position:absolute;left:0;right:0;top:50%;height:3px;
    transform:translateY(-50%);background:#fff;border-radius:2px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);transition:height .1s,opacity .15s;
    opacity:.7;
  }
  .divider:hover::before,.divider.dragging::before{height:5px;opacity:1}
  .divider::after{
    content:'';width:28px;height:14px;border-radius:4px;
    background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);
    position:relative;z-index:1;transition:transform .1s;
  }
  .divider:hover::after,.divider.dragging::after{transform:scale(1.15)}
  .divider .del-hint{
    position:absolute;left:38px;top:50%;transform:translateY(-50%);
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:3px 8px;font-size:10px;color:var(--muted);white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:3;
  }
  .divider:hover .del-hint{opacity:1}

  .add-btn{
    position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:32px;height:32px;border-radius:50%;
    background:var(--surface-alt);border:1px solid var(--border-light);color:var(--muted);
    font-size:20px;font-weight:400;cursor:pointer;z-index:6;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s,transform .1s;
  }
  .add-btn:hover{background:var(--surface-hover);color:var(--text);transform:translateX(-50%) scale(1.1)}
  .add-btn:active{transform:translateX(-50%) scale(.95)}

  .bottombar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 20px;background:var(--surface);border-top:1px solid var(--border);
    flex-shrink:0;font-size:12px;color:var(--muted);
  }
  .save-status{display:flex;align-items:center;gap:6px}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
  .bottombar .shortcuts{display:flex;gap:16px;flex-wrap:wrap}
  .bottombar kbd{
    background:var(--surface-alt);border:1px solid var(--border);border-radius:4px;
    padding:1px 6px;font-size:11px;font-family:ui-monospace,monospace;
  }

  @media(max-width:900px){
    .week{grid-template-columns:1fr;grid-template-rows:repeat(7,minmax(140px,1fr));overflow-y:auto}
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Календарь недели</h1>
    <div class="sub" id="weekLabel">—</div>
  </div>
  <div class="toolbar">
    <button class="palette-btn" id="paletteBtn">
      <div class="swatches" id="palettePreview"></div>
      Палитра
    </button>
    <button class="tool-btn" id="resetBtn" title="Сбросить неделю">↺</button>
  </div>
</div>

<div class="palette-pop" id="palettePop">
  <h3>Цвет дня</h3>
  <div class="palette-grid" id="paletteGrid"></div>
  <div class="palette-custom">
    <input type="color" id="customColor" value="#4F98A3">
    <span>Свой цвет</span>
  </div>
  <div class="palette-hint">Кликните по заголовку дня, затем выберите цвет.</div>
</div>

<div class="week" id="week"></div>

<div class="bottombar">
  <div class="save-status">
    <span class="save-dot"></span> <span id="saveText">Сохранено</span>
  </div>
  <div class="shortcuts">
    <span><kbd>тяну</kbd> разделитель — время</span>
    <span><kbd>двойной клик</kbd> по разделителю — удалить</span>
    <span><kbd>+</kbd> внизу — добавить отрезок</span>
  </div>
</div>

<script>
const KEY = 'week_calendar_v3';
const $ = id => document.getElementById(id);

const DAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MINUTES_IN_DAY = 1440;
const MIN_SEG_MIN = 15;
const DEFAULT_BOUNDS = [240, 480, 720, 960, 1200];

const PALETTE = [
  '#4F98A3','#20808D','#01696F','#1B474D',
  '#A84B2F','#964219','#D19900','#FFC553',
  '#437A22','#6DAA45','#848456','#6E522B',
  '#944454','#A12C7B','#7A39BB','#3B6BBA',
  '#5591C7','#006494','#D163A7','#BB653B',
  '#797876','#393836','#5A5957','#CDCCCA'
];

function shadeColor(hex, pct){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const f=(c)=>{ const v=Math.round(c+(pct<0?c*(pct/100):(255-c)*(pct/100))); return Math.max(0,Math.min(255,v)); };
  return `#${f(r).toString(16).padStart(2,'0')}${f(g).toString(16).padStart(2,'0')}${f(b).toString(16).padStart(2,'0')}`;
}
function segColors(base, count){
  if(count <= 1) return [base];
  const step = 40 / (count - 1);
  return Array.from({length:count},(_,i)=>shadeColor(base, -20 + i*step));
}

let state = {
  selectedDay: 0,
  days: DAYS_SHORT.map((_,i) => ({
    color: i < 5 ? '#4F98A3' : '#A84B2F',
    bounds: [...DEFAULT_BOUNDS],
    labels: ['','','','','','']
  }))
};

let saveTimer = null;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  $('saveText').textContent = 'Сохранено';
  $('saveText').style.color = '';
}
function scheduleSave(){
  $('saveText').textContent = 'Сохранение…';
  $('saveText').style.color = 'var(--primary)';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const loaded = JSON.parse(raw);
      if(loaded.days && loaded.days.length === 7){
        state = loaded;
        if(typeof state.selectedDay !== 'number') state.selectedDay = 0;
        state.days.forEach(d => {
          if(!Array.isArray(d.bounds)) d.bounds = [...DEFAULT_BOUNDS];
          if(!Array.isArray(d.labels)) d.labels = d.bounds.map(()=>'');
          // sync labels length with bounds+1
          while(d.labels.length < d.bounds.length + 1) d.labels.push('');
          d.labels.length = d.bounds.length + 1;
        });
      }
    }
  }catch(e){}
}

function minToTime(m){
  m = Math.max(0, Math.min(MINUTES_IN_DAY, Math.round(m)));
  const h = Math.floor(m/60), mm = m%60;
  return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

function getWeekDates(){
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    return d.getDate();
  });
}

function buildPalette(){
  const grid = $('paletteGrid');
  grid.innerHTML = PALETTE.map(c =>
    `<div class="palette-swatch" data-c="${c}" style="background:${c}"></div>`
  ).join('');
  grid.addEventListener('click', e => {
    const sw = e.target.closest('.palette-swatch');
    if(!sw) return;
    applyColor(sw.dataset.c);
  });
  $('customColor').addEventListener('input', e => applyColor(e.target.value));
}

function applyColor(color){
  state.days[state.selectedDay].color = color;
  scheduleSave(); render();
}

function renderPalettePreview(){
  const unique = [...new Set(state.days.map(d=>d.color))].slice(0,5);
  $('palettePreview').innerHTML = unique.map(c =>
    `<div class="sw" style="background:${c}"></div>`
  ).join('');
}

function render(){
  const dates = getWeekDates();
  const week = $('week');

  week.innerHTML = state.days.map((day, i) => {
    const isSelected = i === state.selectedDay;
    const bounds = [0, ...day.bounds, MINUTES_IN_DAY];
    const numSegs = bounds.length - 1;
    const colors = segColors(day.color, numSegs);

    const blocks = Array.from({length:numSegs}, (_,j) => {
      const top = bounds[j], bot = bounds[j+1];
      const topPct = (top / MINUTES_IN_DAY) * 100;
      const heightPct = ((bot - top) / MINUTES_IN_DAY) * 100;
      const label = (day.labels[j] !== undefined ? day.labels[j] : '') || '';
      return `<div class="seg-block" style="top:${topPct}%;height:${heightPct}%;background:${colors[j]}" data-day="${i}" data-seg="${j}">
        <span class="seg-time">${minToTime(top)}–${minToTime(bot)}</span>
        <input class="seg-label" data-day="${i}" data-seg="${j}" placeholder="Подпись…" value="${label}" maxlength="30">
      </div>`;
    }).join('');

    const dividers = day.bounds.map((b,j) => {
      const pct = (b / MINUTES_IN_DAY) * 100;
      return `<div class="divider" data-day="${i}" data-bound="${j}" style="top:${pct}%">
        <span class="del-hint">двойной клик — удалить</span>
      </div>`;
    }).join('');

    return `
      <div class="day-col" data-day="${i}">
        <div class="day-head ${isSelected?'selected':''}" data-day="${i}">
          <div>
            <div class="day-name" style="color:${day.color}">${DAYS_SHORT[i]}</div>
            <div class="day-num">${dates[i]}</div>
          </div>
          <div class="day-color-dot" data-day="${i}" style="background:${day.color}"></div>
        </div>
        <div class="track-wrap">
          <div class="track">${blocks}${dividers}</div>
          <button class="add-btn" data-day="${i}" title="Добавить отрезок">+</button>
        </div>
      </div>
    `;
  }).join('');

  const cc = state.days[state.selectedDay].color;
  document.querySelectorAll('.palette-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.c.toLowerCase() === cc.toLowerCase());
  });
  $('customColor').value = cc;
  renderPalettePreview();

  const now = new Date();
  $('weekLabel').textContent = now.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) +
    ' — ' + new Date(now.getTime()+6*86400000).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) +
    ` · ${now.getFullYear()}`;
}

// --- добавить отрезок: разделить самый большой ---
function addSegment(dayIdx){
  const day = state.days[dayIdx];
  const bounds = [0, ...day.bounds, MINUTES_IN_DAY];
  // найти самый большой отрезок
  let maxLen = 0, maxIdx = 0;
  for(let j = 0; j < bounds.length - 1; j++){
    const len = bounds[j+1] - bounds[j];
    if(len > maxLen){ maxLen = len; maxIdx = j; }
  }
  if(maxLen < MIN_SEG_MIN * 2) return; // слишком маленький для деления
  const mid = Math.round((bounds[maxIdx] + bounds[maxIdx+1]) / 2 / 5) * 5;
  day.bounds.splice(maxIdx, 0, mid);
  day.labels.splice(maxIdx + 1, 0, '');
  scheduleSave(); render();
}

// --- удалить разделитель (объединить отрезки) ---
function removeDivider(dayIdx, boundIdx){
  const day = state.days[dayIdx];
  if(day.bounds.length <= 1) return; // минимум 1 отрезок (0 разделителей)
  day.bounds.splice(boundIdx, 1);
  day.labels.splice(boundIdx + 1, 1);
  // keep labels in sync
  while(day.labels.length > day.bounds.length + 1) day.labels.pop();
  scheduleSave(); render();
}

// --- события ---
$('paletteBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('palettePop').classList.toggle('open');
});
document.addEventListener('click', e => {
  if(!e.target.closest('.palette-pop') && !e.target.closest('#paletteBtn')){
    $('palettePop').classList.remove('open');
  }
});

// выбор дня
$('week').addEventListener('click', e => {
  const head = e.target.closest('.day-head');
  if(head){
    state.selectedDay = parseInt(head.dataset.day);
    scheduleSave(); render(); return;
  }
  const dot = e.target.closest('.day-color-dot');
  if(dot){
    state.selectedDay = parseInt(dot.dataset.day);
    $('palettePop').classList.add('open');
    scheduleSave(); render(); return;
  }
  const addBtn = e.target.closest('.add-btn');
  if(addBtn){
    addSegment(parseInt(addBtn.dataset.day));
    return;
  }
});

// редактирование подписи
$('week').addEventListener('input', e => {
  const t = e.target;
  if(t.classList.contains('seg-label')){
    const d = parseInt(t.dataset.day), s = parseInt(t.dataset.seg);
    state.days[d].labels[s] = t.value;
    scheduleSave();
  }
});

// двойной клик по разделителю — удалить
$('week').addEventListener('dblclick', e => {
  const div = e.target.closest('.divider');
  if(!div) return;
  e.preventDefault();
  removeDivider(parseInt(div.dataset.day), parseInt(div.dataset.bound));
});

// перетаскивание разделителей
let dragDiv = null, dragDay = -1, dragBound = -1, trackRect = null;

$('week').addEventListener('pointerdown', e => {
  const div = e.target.closest('.divider');
  if(!div) return;
  e.preventDefault();
  dragDiv = div;
  dragDay = parseInt(div.dataset.day);
  dragBound = parseInt(div.dataset.bound);
  const track = div.closest('.track');
  trackRect = track.getBoundingClientRect();
  div.classList.add('dragging');
  div.setPointerCapture(e.pointerId);
});

$('week').addEventListener('pointermove', e => {
  if(!dragDiv) return;
  let pct = (e.clientY - trackRect.top) / trackRect.height;
  pct = Math.max(0.001, Math.min(0.999, pct));
  let minutes = Math.round(pct * MINUTES_IN_DAY / 5) * 5;

  const bounds = state.days[dragDay].bounds;
  const prevBound = dragBound === 0 ? 0 : bounds[dragBound - 1];
  const nextBound = dragBound === bounds.length - 1 ? MINUTES_IN_DAY : bounds[dragBound + 1];
  minutes = Math.max(prevBound + MIN_SEG_MIN, Math.min(nextBound - MIN_SEG_MIN, minutes));
  bounds[dragBound] = minutes;

  dragDiv.style.top = (minutes / MINUTES_IN_DAY * 100) + '%';
  const col = dragDiv.closest('.day-col');
  const blocks = col.querySelectorAll('.seg-block');
  const allBounds = [0, ...bounds, MINUTES_IN_DAY];
  blocks.forEach((blk, j) => {
    const top = allBounds[j], bot = allBounds[j+1];
    blk.style.top = (top / MINUTES_IN_DAY * 100) + '%';
    blk.style.height = ((bot - top) / MINUTES_IN_DAY * 100) + '%';
    const timeEl = blk.querySelector('.seg-time');
    if(timeEl) timeEl.textContent = `${minToTime(top)}–${minToTime(bot)}`;
  });
  scheduleSave();
});

$('week').addEventListener('pointerup', e => {
  if(dragDiv){
    dragDiv.classList.remove('dragging');
    dragDiv = null; dragDay = -1; dragBound = -1; trackRect = null;
  }
});

// сброс
$('resetBtn').addEventListener('click', () => {
  if(!confirm('Сбросить всю неделю к значениям по умолчанию?')) return;
  localStorage.removeItem(KEY);
  state = {
    selectedDay: 0,
    days: DAYS_SHORT.map((_,i) => ({
      color: i < 5 ? '#4F98A3' : '#A84B2F',
      bounds: [...DEFAULT_BOUNDS],
      labels: ['','','','','','']
    }))
  };
  save(); render();
});

load();
buildPalette();
render();
</script>
<script data-pplx-inline-edit>
(function () {
  if (window === window.top) return;

  const allowedParentOrigins = ["https://www.perplexity.ai","https://perplexity.ai","https://testing.perplexity.ai","https://staging.perplexity.ai","https://*.preview.i.perplexity.ai","http://perplexity.localhost","http://localhost:1420","http://127.0.0.1:1420","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"];
  const MAX_FONT_BYTES = 500 * 1024;
  const MAX_TOTAL_FONT_BYTES = 2 * 1024 * 1024;
  let scrollForwarding = false;
  let scrollRaf = 0;
  let trustedTopOrigin = null;

  // Allow entries like "https://*.preview.i.perplexity.ai" — the wildcard
  // matches a single DNS label (no dots), so "https://*.foo" cannot stretch
  // across multiple labels.
  function matchesAllowedOrigin(origin) {
    if (!origin) return false;
    for (const entry of allowedParentOrigins) {
      if (!entry.includes("*")) {
        if (entry === origin) return true;
        continue;
      }
      const pattern = new RegExp(
        "^" +
          entry.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^.]+") +
          "$",
      );
      if (pattern.test(origin)) return true;
    }
    return false;
  }

  // Trust decision: when the sender is same-origin-visible (event.origin is a
  // real origin like https://www.perplexity.ai) we trust event.origin directly.
  // When event.origin is "null" (opaque broker srcdoc), we fall back to the
  // broker's stamped `parentOrigin` to identify the top window. The fallback
  // is claim-only — we rely on the browser's native `targetOrigin` enforcement
  // on the response path (see postToTrustedTop) to ensure replies can't be
  // delivered to anyone but the actual top window of that claimed origin.
  function getTrustedParentOrigin(event) {
    const forwardedParentOrigin =
      typeof event.data.parentOrigin === "string" ? event.data.parentOrigin : null;
    const parentOrigin = event.origin === "null" ? forwardedParentOrigin : event.origin;
    return matchesAllowedOrigin(parentOrigin) ? parentOrigin : null;
  }

  // All responses go to window.top with targetOrigin = the allowlisted origin.
  // An attacker that iframes us inside their own null-origin broker can claim
  // any parentOrigin they like, but the browser will drop the reply whenever
  // the real top's origin doesn't match — so the screenshot never leaves.
  function postToTrustedTop(message) {
    if (!trustedTopOrigin) return;
    try {
      window.top.postMessage(message, trustedTopOrigin);
    } catch (_error) {}
  }

  function inlineAll(original, clone) {
    if (original.nodeType !== 1 || clone.nodeType !== 1) return;

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();

</script></body>
</html>
